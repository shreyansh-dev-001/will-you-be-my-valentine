<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-hearts" id="hearts-container"></div>

    <div class="card">
        <h1>Us.</h1>
        
        <div class="polaroid">
            <img src="us.png" alt="Us" onerror="this.src='https://placehold.co/300x300/pink/white?text=Our+Photo';">
        </div>

        <p>Do you know how long we've been together?</p>
        
        <div id="timer" style="font-family: 'Playfair Display'; font-size: 1.2rem; margin: 20px 0; color: #d45d79;">
            </div>

        <a href="surprise.html"><button>Heaviest!</button></a>
    </div>

    <script>
        // Background Animation
        const container = document.getElementById('hearts-container');
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }
        setInterval(createHeart, 300);

        // Timer Logic
        const startDate = new Date("2023-09-27");
        const now = new Date();
        const diffTime = Math.abs(now - startDate);
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)); 
        const diffHours = Math.floor(diffTime / (1000 * 60 * 60));
        const heartbeats = Math.floor((diffTime / (1000 * 60)) * 80);

        document.getElementById('timer').innerHTML = `
            ${diffDays} Days<br>
            <span style="font-size: 0.8em; color: #888;">(${diffHours.toLocaleString()} Hours)</span><br>
            <span style="font-size: 0.8em; color: #888;">~${heartbeats.toLocaleString()} Heartbeats</span>
        `;
    </script>
</body>
</html>
