<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise</title>
    <style>
        body { font-family: 'Courier New', sans-serif; text-align: center; padding: 20px; background-color: #ffe6eb; color: #d63384; }
        
        #scratch-container {
            position: relative;
            width: 300px;
            height: 150px;
            margin: 20px auto;
            border: 2px solid #d63384;
            border-radius: 10px;
            overflow: hidden;
            user-select: none;
        }

        #secret-message {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white; 
            font-weight: bold;
            font-size: 22px;
            color: #d63384;
            position: absolute;
            top: 0; left: 0;
            z-index: 0;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            cursor: pointer;
        }

        #options { display: none; margin-top: 20px; }
        
        button { padding: 10px 30px; font-size: 18px; margin: 10px; cursor: pointer; border-radius: 5px; border: 2px solid #d63384; }
        .yes-btn { background-color: #d63384; color: white; }
        .no-btn { background-color: #ccc; color: #666; border-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>I have a surprise for you...</h1>
    <p>Scratch the card below!</p>

    <div id="scratch-container">
        <div id="secret-message">Will you be my Valentine?</div>
        <canvas id="scratch-canvas" width="300" height="150"></canvas>
    </div>

    <div id="options">
        <a href="yes.html"><button class="yes-btn">Yes</button></a>
        <button class="no-btn" disabled>No</button>
    </div>

    <script>
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        
        // 1. Fill with Gray
        ctx.fillStyle = '#C0C0C0'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 2. Add Text to Scratch Layer
        ctx.fillStyle = '#000';
        ctx.font = '20px Arial';
        ctx.fillText("Scratch Here!", 85, 80);

        let isDrawing = false;

        function scratch(x, y) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2, false);
            ctx.fill();
            checkProgress();
        }

        // Mouse & Touch Listeners
        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            scratch(e.clientX - rect.left, e.clientY - rect.top);
        });

        // Mobile touch support
        canvas.addEventListener('touchstart', (e) => { isDrawing = true; e.preventDefault(); });
        canvas.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            scratch(touch.clientX - rect.left, touch.clientY - rect.top);
        });

        function checkProgress() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparent = 0;
            for (let i = 3; i < pixels.length; i += 4) {
                if (pixels[i] === 0) transparent++;
            }
            // If > 40% cleared, show buttons
            if ((transparent / (pixels.length / 4)) > 0.4) {
                document.getElementById('options').style.display = 'block';
            }
        }
    </script>
</body>
</html>
