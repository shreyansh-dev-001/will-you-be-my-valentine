<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/scratchcard-js@1.3.1/build/scratchcard.min.js"></script>
    
    <style>
        /* Container for the scratch card library */
        .sc__wrapper {
            width: 300px;
            height: 150px;
            margin: 20px auto;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid #d45d79;
        }

        /* The secret message hidden BEHIND the scratch card */
        .sc__container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff0f5; /* Light Pink Background */
        }

        .secret-text {
            font-family: 'Playfair Display', serif;
            font-weight: bold;
            font-size: 24px;
            color: #d45d79;
            text-align: center;
            padding: 10px;
        }

        /* Hide buttons initially */
        #options {
            display: none; 
            margin-top: 20px;
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="bg-hearts" id="hearts-container"></div>

    <div class="card">
        <h1>I have a surprise...</h1>
        <p>Scratch the card to reveal it!</p>

        <div id="js--sc--container" class="sc__wrapper">
            <div class="sc__container">
                <div class="secret-text">Will you be my Valentine?</div>
            </div>
        </div>

        <div id="options">
            <a href="yes.html"><button>Yes</button></a>
            <button disabled style="background-color: #eee; color: #999; box-shadow: none;">No</button>
        </div>
    </div>

    <script>
        // --- 1. Background Hearts Animation ---
        const container = document.getElementById('hearts-container');
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }, 300);


        // --- 2. Realistic Scratch Card Setup ---
        
        // This is a "Data URI" for a silver texture. 
        // It creates a realistic silver foil look without needing an external image file.
        const silverTexture = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAAGQCAMAAAC3Ycb+AAAAA1BMVEWAgICQdD0xAAAANElEQVR4nO3BMQEAAADCoPVPbQ0poAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPgMaAAAB5bgEqAAAAABJRU5ErkJggg==";

        const sc = new ScratchCard('#js--sc--container', {
            scratchType: SCRATCH_TYPE.SPRAY, // This adds the realistic "spray" texture
            containerWidth: 300,
            containerHeight: 150,
            imageForwardSrc: silverTexture, // The top silver layer
            clearZoneRadius: 30, // Larger scratch area
            nPoints: 0,
            pointSize: 0,
            callback: function () {
                // This runs continuously while scratching
            }
        });

        // Initialize the scratch card
        sc.init().then(() => {
            
            // Add instructions on top of the canvas
            const ctx = sc.canvas.getContext('2d');
            ctx.font = '20px Lato';
            ctx.fillStyle = '#555';
            ctx.fillText("Scratch Here!", 90, 80);

            // Check progress manually to trigger the buttons
            sc.canvas.addEventListener('scratch.move', () => {
                let percent = sc.getPercent();
                // If 40% is scratched, show the buttons
                if (percent > 40) {
                    document.getElementById('options').style.display = 'block';
                }
            });
        }).catch((error) => {
            console.error(error.message);
        });
        
    </script>
</body>
</html>
