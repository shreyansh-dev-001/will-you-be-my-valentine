<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific styles for scratch card alignment */
        #scratch-container {
            width: 300px;
            height: 150px;
            margin: 20px auto;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        canvas { position: absolute; top: 0; left: 0; }
        #secret-message {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: #fff0f5; color: #d45d79; font-family: 'Playfair Display'; font-weight: bold; font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="bg-hearts" id="hearts-container"></div>

    <div class="card">
        <h1>I have a surprise...</h1>
        <p>Scratch the card to reveal it!</p>

        <div id="scratch-container">
            <div id="secret-message">Be my Valentine?</div>
            <canvas id="scratch-canvas" width="300" height="150"></canvas>
        </div>

        <div id="options" style="display: none; margin-top: 20px;">
            <a href="yes.html"><button>Yes</button></a>
            <button disabled style="background-color: #eee; color: #999; box-shadow: none;">No</button>
        </div>
    </div>

    <script>
        // Hearts
        const container = document.getElementById('hearts-container');
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }, 300);

        // Scratch Card Logic
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = '#C0C0C0'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#555';
        ctx.font = '20px Lato';
        ctx.fillText("Scratch Here", 95, 80);

        let isDrawing = false;

        function scratch(x, y) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 20, 0, Math.PI * 2, false);
            ctx.fill();
            checkProgress();
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            scratch(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener('touchstart', (e) => { isDrawing = true; e.preventDefault(); });
        canvas.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            scratch(touch.clientX - rect.left, touch.clientY - rect.top);
        });

        function checkProgress() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparent = 0;
            for (let i = 3; i < pixels.length; i += 4) {
                if (pixels[i] === 0) transparent++;
            }
            if ((transparent / (pixels.length / 4)) > 0.4) {
                document.getElementById('options').style.display = 'block';
            }
        }
    </script>
</body>
</html>
