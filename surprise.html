<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Specific styles for scratch card alignment */
        #scratch-container {
            width: 300px;
            height: 150px;
            margin: 20px auto;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid #d45d79;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            cursor: crosshair;
        }

        #secret-message {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff0f5;
            color: #d45d79;
            font-family: 'Playfair Display', serif;
            font-weight: bold;
            font-size: 24px;
            z-index: 1;
        }
        
        #options {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="bg-hearts" id="hearts-container"></div>

    <div class="card">
        <h1>I have a surprise for you ma'am 👀</h1>

        <div id="scratch-container">
            <div id="secret-message">Will you be my Valentine?</div>
            <canvas id="scratch-canvas" width="300" height="150"></canvas>
        </div>

        <div id="options">
            <a href="yes.html"><button>Yes</button></a>
            <button id="no-btn" style="background-color: #efefef; color: #555; border: 1px solid #ccc;">No</button>
        </div>
    </div>

    <script>
        // --- 1. Background Hearts Animation ---
        const container = document.getElementById('hearts-container');
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }, 300);

        // --- 2. Manual Scratch Card Logic ---
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        function initCard() {
            ctx.fillStyle = '#C0C0C0'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#555';
            ctx.font = '20px Lato, sans-serif';
            ctx.fillText("Scratch Here!", 90, 80);
        }
        initCard();

        function scratch(x, y) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = 40;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            lastX = x;
            lastY = y;
            checkProgress();
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            scratch(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);

        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            lastX = touch.clientX - rect.left;
            lastY = touch.clientY - rect.top;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            scratch(touch.clientX - rect.left, touch.clientY - rect.top);
        });

        canvas.addEventListener('touchend', () => isDrawing = false);

        function checkProgress() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparentPixels = 0;
            for (let i = 3; i < pixels.length; i += 4) {
                if (pixels[i] === 0) transparentPixels++;
            }
            const percent = (transparentPixels / (canvas.width * canvas.height)) * 100;
            if (percent > 40) {
                document.getElementById('options').style.display = 'block';
            }
        }

        // --- 3. THE "NO" BUTTON TRAP ---
        document.getElementById('no-btn').addEventListener('click', function() {
            alert("Nuuuuu Not allow! (meow kahiki)");
        });

    </script>
</body>
</html>
