<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/scratchcard-js@1.3.1/build/scratchcard.min.js"></script>
    
    <style>
        /* Container for the scratch card library */
        .sc__wrapper {
            width: 300px;
            height: 150px;
            margin: 20px auto;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid #d45d79;
        }

        /* The secret message hidden BEHIND the scratch card */
        .sc__container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff0f5; /* Light Pink Background */
        }

        .secret-text {
            font-family: 'Playfair Display', serif;
            font-weight: bold;
            font-size: 24px;
            color: #d45d79;
            text-align: center;
            padding: 10px;
        }

        /* Hide buttons initially */
        #options {
            display: none; 
            margin-top: 20px;
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="bg-hearts" id="hearts-container"></div>

    <div class="card">
        <h1>I have a surprise...</h1>
        <p>Scratch the card to reveal it!</p>

        <div id="js--sc--container" class="sc__wrapper">
            <div class="sc__container">
                <div class="secret-text">Will you be my Valentine?</div>
            </div>
        </div>

        <div id="options">
            <a href="yes.html"><button>Yes</button></a>
            <button disabled style="background-color: #eee; color: #999; box-shadow: none;">No</button>
        </div>
    </div>

    <script>
        // --- 1. Background Hearts Animation ---
        const container = document.getElementById('hearts-container');
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            container.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 6000);
        }, 300);

        // --- 2. Realistic Scratch Card Setup ---
        
        // This function ensures the library is loaded before we run the code
        window.addEventListener('load', function() {
            
            // A simple Base64 Silver Image (1x1 pixel stretched)
            // This bypasses the "Tracking Prevention" error because it's not an external download
            const base64Silver = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';

            const sc = new ScratchCard('#js--sc--container', {
                scratchType: SCRATCH_TYPE.SPRAY, // <--- FIXED: Removed 'ScratchCard.' prefix
                containerWidth: 300,
                containerHeight: 150,
                imageForwardSrc: base64Silver, // <--- FIXED: Using embedded image
                clearZoneRadius: 30,
                nPoints: 30,
                pointSize: 4,
                callback: function () {
                    // runs continuously
                }
            });

            // Initialize
            sc.init().then(() => {
                sc.canvas.addEventListener('scratch.move', () => {
                let percent = sc.getPercent();
                if (percent > 40) {
                    document.getElementById('options').style.display = 'block';
                }
            });
            }).catch((error) => {
                console.error("Scratch Card Error:", error);
                // Fail-safe: show the content if something breaks
                document.getElementById('options').style.display = 'block';
            });
        });
    </script>
</body>
</html>
